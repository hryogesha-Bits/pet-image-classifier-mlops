name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test-build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}/pet-image-classifier-mlops', github.repository_owner) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Prepare deterministic smoke-test artifacts
        run: python scripts/prepare_smoke_artifacts.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:ci-${GITHUB_SHA::7}" -t "$IMAGE_NAME:latest" .

      - name: Run container for smoke tests
        run: |
          docker run -d --name web -p 8000:8000 \
            -e MODEL_PATH=/app/models/model.pt \
            -e MODEL_NAME=baseline_cnn \
            -v "${{ github.workspace }}/models:/app/models:ro" \
            "$IMAGE_NAME:latest"

      - name: Smoke tests
        run: |
          bash scripts/smoke_test.sh http://localhost:8000
          bash scripts/smoke_test_predict.sh http://localhost:8000 data/ci/sample.jpg

      - name: Show container logs on failure
        if: failure()
        run: docker logs web || true

      - name: Stop container
        if: always()
        run: docker rm -f web || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE_NAME:latest" "$IMAGE_NAME:${GITHUB_SHA::7}"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA::7}"
