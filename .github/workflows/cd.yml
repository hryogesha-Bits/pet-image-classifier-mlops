name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}/pet-image-classifier-mlops', github.repository_owner) }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      MODEL_NAME: baseline_cnn

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare deployment model artifact
        run: |
          python -m pip install --disable-pip-version-check torch==2.9.0 torchvision==0.24.0 pillow==12.1.0
          python scripts/prepare_smoke_artifacts.py

      - name: Deploy published image with Docker Compose
        run: |
          export IMAGE_TAG="${IMAGE_TAG::7}"
          docker compose pull app
          docker compose up -d --no-build app prometheus grafana
          docker compose ps

      - name: Wait for application health
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health; then
              echo
              exit 0
            fi
            sleep 3
          done
          docker compose logs app
          exit 1

      - name: Post-deployment smoke tests
        run: |
          bash scripts/smoke_test.sh http://localhost:8000
          bash scripts/smoke_test_predict.sh http://localhost:8000 data/ci/sample.jpg

      - name: Show deployment logs on failure
        if: failure()
        run: docker compose logs --no-color app prometheus grafana || true

      - name: Tear down ephemeral deployment
        if: always()
        run: docker compose down -v
